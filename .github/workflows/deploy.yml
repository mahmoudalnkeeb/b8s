name: CI/CD Pipeline

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'compose.yml'
      - 'ec2-nginx.conf'
      - 'package.json'
      - 'yarn.lock'
      - '.github/workflows/deploy.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'compose.yml'
      - 'ec2-nginx.conf'
      - 'package.json'
      - 'yarn.lock'
      - '.github/workflows/deploy.yml'

jobs:
  test-and-build-code:
    name: Code Quality & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'yarn'

      - name: Install Dependencies
        run: yarn install --frozen-lockfile

      - name: Check Backend Types
        run: yarn workspace b8s-backend run tsc --noEmit

      - name: Check Frontend Types
        run: yarn workspace frontend run tsc --noEmit

  build-and-push-images:
    name: Build and Push Docker Images
    needs: test-and-build-code
    runs-on: ubuntu-latest
    if: github.event_name == 'push' # Only push images on merges to main
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Backend (App)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./backend/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/b8s-app:latest

      - name: Build and Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/b8s-frontend:latest
          build-args: |
            VITE_API_URL=/api

  deploy-to-swarm:
    name: Deploy to EC2 Docker Swarm
    needs: build-and-push-images
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create deployment directory on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: mkdir -p /home/${{ secrets.EC2_USERNAME }}/b8s-deployment

      - name: Copy compose.yml to Manager Node
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: 'compose.yml,ec2-nginx.conf'
          target: '/home/${{ secrets.EC2_USERNAME }}/b8s-deployment/'
          strip_components: 0
          debug: true
          overwrite: true
          rm: true

      - name: Create .env file on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cat > /home/${{ secrets.EC2_USERNAME }}/b8s-deployment/.env << 'EOF'
            NODE_ENV=production
            PORT=3000
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            MONGODB_URI=${{ secrets.MONGODB_URI }}
            VECTOR_DB_URL=${{ secrets.VECTOR_DB_URL }}
            VECTOR_DB_TYPE=qdrant
            OLLAMA_URL=http://ollama:11434
            REDIS_URL=redis://redis:6379
            GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
            GENAI_MODEL=${{ secrets.GENAI_MODEL }}
            DEEPSEEK_API_KEY=${{ secrets.DEEPSEEK_API_KEY }}
            DEEPSEEK_MODEL=${{ secrets.DEEPSEEK_MODEL }}
            EMBEDDING_MODEL=nomic-embed-text-v2-moe
            EOF

      - name: Pull latest images on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker pull ${{ secrets.DOCKER_USERNAME }}/b8s-app:latest
            docker pull ${{ secrets.DOCKER_USERNAME }}/b8s-frontend:latest

      - name: Execute Swarm Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/${{ secrets.EC2_USERNAME }}/b8s-deployment
            export DOCKER_REGISTRY=${{ secrets.DOCKER_USERNAME }}
            docker stack deploy --with-registry-auth -c compose.yml b8s

      - name: Clean up old Docker images
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Remove dangling images (old layers left after pulling new :latest)
            docker image prune -f
            # Remove any images not used by running containers
            docker image prune -af --filter "until=1h" || true
