name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test-and-build-code:
    name: Code Quality & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'yarn'

      - name: Install Dependencies
        run: yarn install --frozen-lockfile

      - name: Check Backend Types
        run: yarn workspace b8s-backend run tsc --noEmit

      - name: Check Frontend Types
        run: yarn workspace frontend run tsc --noEmit

  build-and-push-images:
    name: Build and Push Docker Images
    needs: test-and-build-code
    runs-on: ubuntu-latest
    if: github.event_name == 'push' # Only push images on merges to main
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Backend (App)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./backend/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/b8s-app:latest

      - name: Build and Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/b8s-frontend:latest
          build-args: |
            VITE_API_URL=/api

  deploy-to-swarm:
    name: Deploy to EC2 Docker Swarm
    needs: build-and-push-images
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create deployment directory on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: mkdir -p /home/${{ secrets.EC2_USERNAME }}/b8s-deployment

      - name: Copy compose.yml to Manager Node
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: 'compose.yml,ec2-nginx.conf'
          target: '/home/${{ secrets.EC2_USERNAME }}/b8s-deployment/'
          strip_components: 0
          debug: true
          overwrite: true
          rm: true

      - name: Remove old Docker images
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Remove dangling images and old versions
            docker image prune -f
            docker images -f "dangling=true" -q | xargs -r docker rmi || true
            docker system prune -af --filter "until=24h" || true

      - name: Execute Swarm Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/${{ secrets.EC2_USERNAME }}/b8s-deployment
            # Ensure .env exists so compose doesn't throw an error missing the file
            touch .env
            # Export the registry to match whatever was built
            export DOCKER_REGISTRY=${{ secrets.DOCKER_USERNAME }}
            # Deploy across the swarm
            docker stack deploy --with-registry-auth -c compose.yml b8s
