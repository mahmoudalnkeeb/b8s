services:
  app:
    image: ${DOCKER_REGISTRY:-mahmoudalnakeeb}/b8s-app:latest
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    ports:
      - '${PORT:-3000}:3000'
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongodb:27017/b8s
      - VECTOR_DB_URL=http://qdrant:6333
      - OLLAMA_URL=http://ollama:11434
      - REDIS_URL=redis://redis:6379
    depends_on:
      - mongodb
      - qdrant
      - ollama
      - redis
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.type == app

  frontend:
    image: ${DOCKER_REGISTRY:-mahmoudalnakeeb}/b8s-frontend:latest
    build:
      context: .
      dockerfile: ./frontend/Dockerfile
      args:
        - VITE_API_URL=http://localhost:3000/api
    ports:
      - '3001:80'
    environment:
      - VITE_API_URL=http://localhost:3000/api
    depends_on:
      - app
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.type == app

  mongodb:
    image: mongo:latest
    restart: always
    ports:
      - '27018:27017'
    volumes:
      - mongo_data:/data/db
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.type == db

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - '6333:6333'
      - '6334:6334'
    volumes:
      - qdrant_data:/qdrant/storage
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.type == db

  redis:
    image: redis:alpine
    restart: always
    ports:
      - '6380:6379'
    volumes:
      - redis_data:/data
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.type == db

  ollama:
    image: ollama/ollama:latest
    ports:
      - '11435:11434'
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ['CMD', 'ollama', 'list']
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.type == ai

  # Helper to pull the embedding model automatically
  ollama-pull:
    image: curlimages/curl:latest
    deploy:
      restart_policy:
        condition: on-failure
        max_attempts: 10
      placement:
        constraints:
          - node.labels.type == ai
    entrypoint:
      [
        'sh',
        '-c',
        'while ! curl -s http://ollama:11434 >/dev/null; do echo "Waiting for Ollama..."; sleep 5; done; echo "Starting pull..."; curl -X POST http://ollama:11434/api/pull -d ''{"name": "nomic-embed-text-v2-moe"}''',
      ]

volumes:
  mongo_data:
  qdrant_data:
  redis_data:
  ollama_data:
