<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <!-- Background Gradient -->
    <linearGradient id="hub-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
  </defs>

  <!-- Hexagonal Hub Base -->
  <path d="M100 20 L170 60 L170 140 L100 180 L30 140 L30 60 Z" fill="#0A0A0B" stroke="url(#hub-grad)" stroke-width="4" filter="url(#glow)" />
  
  <!-- Central Hub Node -->
  <circle cx="100" cy="100" r="15" fill="url(#hub-grad)" filter="url(#glow)" />
  
  <!-- Connections -->
  <g stroke="url(#hub-grad)" stroke-width="3" stroke-linecap="round" opacity="0.8">
    <line x1="100" y1="100" x2="100" y2="45" />
    <line x1="100" y1="100" x2="150" y2="75" />
    <line x1="100" y1="100" x2="150" y2="125" />
    <line x1="100" y1="100" x2="100" y2="155" />
    <line x1="100" y1="100" x2="50" y2="125" />
    <line x1="100" y1="100" x2="50" y2="75" />
  </g>

  <!-- Outer Nodes -->
  <g fill="#E0F2FE" filter="url(#glow)">
    <circle cx="100" cy="45" r="5" />
    <circle cx="150" cy="75" r="5" />
    <circle cx="150" cy="125" r="5" />
    <circle cx="100" cy="155" r="5" />
    <circle cx="50" cy="125" r="5" />
    <circle cx="50" cy="75" r="5" />
  </g>
</svg>
